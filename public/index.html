<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Mullisa-JM</title>

<meta name="theme-color" content="#087443">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f6f4;
  color:#17221d;
}

header{
  background:#087443;
  color:white;
  padding:14px;
  position:sticky;
  top:0;
  z-index:10;
}

header h2{
  margin:0;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#087443;
  color:white;
}

.danger{
  background:#c62828;
  color:white;
}

.light{
  background:#e5eee9;
}

input{
  width:100%;
  padding:13px;
  margin:6px 0;
  border:1px solid #ccd8d2;
  border-radius:10px;
}

textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccd8d2;
  border-radius:10px;
}

.card{
  background:white;
  margin:12px;
  padding:15px;
  border-radius:15px;
  box-shadow:0 2px 10px #0001;
}

.hidden{
  display:none!important;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:8px 2px;
  box-shadow:0 -2px 10px #0002;
  z-index:20;
}

nav button{
  background:none;
  font-size:12px;
  padding:7px;
}

.page{
  padding-bottom:80px;
}

.user{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #eee;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#087443;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.online{
  width:10px;
  height:10px;
  background:#18a558;
  border-radius:50%;
}

.chatbox{
  height:55vh;
  overflow:auto;
  padding:10px;
  background:#edf4f0;
  border-radius:12px;
}

.msg{
  max-width:78%;
  padding:9px 12px;
  margin:7px 0;
  border-radius:13px;
  background:white;
}

.mine{
  margin-left:auto;
  background:#087443;
  color:white;
}

.chat-input{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.chat-input input{
  margin:0;
}

.video-area{
  background:#111;
  border-radius:15px;
  min-height:260px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

video{
  width:100%;
  max-height:400px;
  background:#111;
}

#localVideo{
  position:absolute;
  width:120px;
  height:160px;
  right:10px;
  bottom:10px;
  object-fit:cover;
  border:2px solid white;
  border-radius:10px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.badge{
  background:#e5eee9;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
}

.center{
  text-align:center;
}

#auth{
  max-width:420px;
  margin:40px auto;
}
</style>

<script src="/socket.io/socket.io.js"></script>
</head>

<body>

<header>
  <h2>🎙️ Mullisa-JM</h2>
  <small>Chat • Call • Video • Club</small>
</header>

<div id="auth" class="card">

  <div id="loginBox">
    <h3>Seeni</h3>

    <input id="loginUsername"
           placeholder="Username">

    <input id="loginPassword"
           type="password"
           placeholder="Password">

    <button class="primary"
            onclick="login()">
      Seeni
    </button>

    <button class="light"
            onclick="showRegister()">
      Account Haaraa Uumi
    </button>
  </div>

  <div id="registerBox" class="hidden">
    <h3>Account Uumi</h3>

    <input id="regName"
           placeholder="Maqaa kee">

    <input id="regUsername"
           placeholder="Username">

    <input id="regPassword"
           type="password"
           placeholder="Password">

    <button class="primary"
            onclick="register()">
      Galmaa'i
    </button>

    <button class="light"
            onclick="showLogin()">
      Deebi'i
    </button>
  </div>

  <p id="authMsg"></p>
</div>


<div id="app" class="hidden page">

  <!-- HOME -->
  <section id="homePage">

    <div class="card">
      <h3>🏠 Baga Nagaan Dhuftan</h3>
      <p>
        Mullisa-JM keessatti Chat, Call,
        Video Call fi Voice Club fayyadami.
      </p>
    </div>

    <div class="card">
      <h3>🎙️ Voice Club</h3>

      <input id="clubName"
             placeholder="Maqaa Club">

      <button class="primary"
              onclick="createClub()">
        ➕ Club Uumi
      </button>

      <hr>

      <input id="clubCode"
             placeholder="Club Code">

      <button class="primary"
              onclick="joinClub()">
        🔗 Club Seeni
      </button>
    </div>

    <div class="card">
      <h3>🔎 Nama Barbaadi</h3>

      <input id="searchInput"
             placeholder="Maqaa ykn username"
             oninput="searchUsers()">

      <div id="usersList"></div>
    </div>

  </section>


  <!-- CHAT -->
  <section id="chatPage" class="hidden">

    <div class="card">
      <h3 id="chatTitle">💬 Chat</h3>

      <div id="chatBox"
           class="chatbox"></div>

      <div class="chat-input">
        <input id="chatInput"
               placeholder="Ergaa barreessi...">

        <button class="primary"
                onclick="sendMessage()">
          ➤
        </button>
      </div>
    </div>

  </section>


  <!-- CLUB -->
  <section id="clubPage" class="hidden">

    <div class="card">

      <h3>🎙️ <span id="clubTitle">
        Voice Club
      </span></h3>

      <span class="badge">
        Hanga 10 speakers
      </span>

      <div class="controls">

        <button class="primary"
                onclick="toggleMic()">
          🎤 Mic
        </button>

        <button class="light"
                onclick="raiseHand()">
          🙋 Raise Hand
        </button>

        <button class="light"
                onclick="shareClub()">
          🔗 Share
        </button>

        <button class="danger"
                onclick="leaveClub()">
          🚪 Ba'i
        </button>

      </div>

      <h4>👥 Members</h4>

      <div id="clubMembers"></div>

    </div>

    <div class="card">
      <h3>💬 Club Chat</h3>

      <div id="clubChatBox"
           class="chatbox"></div>

      <div class="chat-input">
        <input id="clubChatInput"
               placeholder="Club keessatti barreessi...">

        <button class="primary"
                onclick="sendClubMessage()">
          ➤
        </button>
      </div>
    </div>

  </section>


  <!-- CALL -->
  <section id="callPage" class="hidden">

    <div class="card">

      <h3 id="callTitle">
        📞 Call
      </h3>

      <div class="video-area">

        <video id="remoteVideo"
               autoplay
               playsinline></video>

        <video id="localVideo"
               autoplay
               muted
               playsinline></video>

      </div>

      <div class="controls">

        <button class="light"
                onclick="toggleCallMic()">
          🎤 Mic
        </button>

        <button class="light"
                onclick="toggleCamera()">
          📷 Camera
        </button>

        <button class="danger"
                onclick="endCall()">
          ❌ Cufi
        </button>

      </div>

    </div>

  </section>


  <!-- PROFILE -->
  <section id="profilePage" class="hidden">

    <div class="card center">

      <div id="profileAvatar"
           class="avatar"
           style="margin:auto">
        U
      </div>

      <h3 id="profileName"></h3>
      <p id="profileUsername"></p>

      <button class="danger"
              onclick="logout()">
        Ba'i
      </button>

    </div>

  </section>

</div>


<nav id="nav" class="hidden">

  <button onclick="showPage('homePage')">
    🏠<br>Home
  </button>

  <button onclick="showPage('chatPage')">
    💬<br>Chat
  </button>

  <button onclick="showPage('clubPage')">
    🎙️<br>Club
  </button>

  <button onclick="showPage('profilePage')">
    👤<br>Profile
  </button>

</nav>


<script>
let token = localStorage.getItem("mullisa_token");
let me = null;
let socket = null;

let currentChatUser = null;
let currentClub = null;

let localStream = null;
let peer = null;
let currentCallUser = null;
let currentCallType = "video";

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    },
    {
      urls: "stun:stun1.l.google.com:19302"
    }
  ]
};


/* AUTH UI */

function showRegister(){
  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("registerBox")
    .classList.remove("hidden");
}

function showLogin(){
  document.getElementById("registerBox")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");
}


/* API */

async function api(url, options = {}){

  options.headers = {
    ...(options.headers || {}),
    "Content-Type":"application/json"
  };

  if(token){
    options.headers.Authorization =
      "Bearer " + token;
  }

  const res = await fetch(url, options);

  const data = await res.json()
    .catch(() => ({}));

  if(!res.ok){
    throw new Error(
      data.error || "Error"
    );
  }

  return data;
}


/* REGISTER */

async function register(){

  try{

    const data = await api(
      "/api/register",
      {
        method:"POST",
        body:JSON.stringify({
          name:document.getElementById("regName").value,
          username:document.getElementById("regUsername").value,
          password:document.getElementById("regPassword").value
        })
      }
    );

    token = data.token;

    localStorage.setItem(
      "mullisa_token",
      token
    );

    await startApp();

  }catch(e){

    document.getElementById("authMsg")
      .textContent = "❌ " + e.message;
  }
}


/* LOGIN */

async function login(){

  try{

    const data = await api(
      "/api/login",
      {
        method:"POST",
        body:JSON.stringify({
          username:
            document.getElementById(
              "loginUsername"
            ).value,

          password:
            document.getElementById(
              "loginPassword"
            ).value
        })
      }
    );

    token = data.token;

    localStorage.setItem(
      "mullisa_token",
      token
    );

    await startApp();

  }catch(e){

    document.getElementById("authMsg")
      .textContent = "❌ " + e.message;
  }
}


/* START */

async function startApp(){

  try{

    me = await api("/api/me");

    document.getElementById("auth")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

    document.getElementById("nav")
      .classList.remove("hidden");

    document.getElementById("profileName")
      .textContent = me.name;

    document.getElementById("profileUsername")
      .textContent = "@" + me.username;

    document.getElementById("profileAvatar")
      .textContent =
      me.name.charAt(0).toUpperCase();

    connectSocket();

  }catch(e){

    logout();
  }
}


/* SOCKET */

function connectSocket(){

  socket = io();

  socket.on("connect", () => {

    socket.emit(
      "user-online",
      me.id
    );

  });


  socket.on("private-message", msg => {

    if(
      currentChatUser &&
      (
        msg.sender_id === currentChatUser.id ||
        msg.receiver_id === currentChatUser.id
      )
    ){
      addChatMessage(msg);
    }

  });


  socket.on("incoming-call", async data => {

    const answer = confirm(
      "📞 " +
      data.fromName +
      " siif waamaa jira.\n\n" +
      (
        data.callType === "video"
        ? "🎥 Video Call"
        : "📞 Voice Call"
      )
    );

    if(!answer) return;

    await receiveCall(data);

  });


  socket.on("call-answered", async data => {

    if(peer){

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );
    }

  });


  socket.on("ice-candidate", async data => {

    if(peer && data.candidate){

      try{

        await peer.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }catch(e){
        console.log(e);
      }

    }

  });


  socket.on("call-ended", () => {
    endCallLocal();
  });


  socket.on("club-message", msg => {

    if(
      currentClub &&
      msg.userId
    ){
      addClubMessage(msg);
    }

  });


  socket.on("club-action", data => {

    if(data.action === "mute"){
      alert("Host si mute godhe.");
    }

  });

}


/* PAGES */

function showPage(id){

  [
    "homePage",
    "chatPage",
    "clubPage",
    "callPage",
    "profilePage"
  ].forEach(page => {

    document.getElementById(page)
      .classList.add("hidden");

  });

  document.getElementById(id)
    .classList.remove("hidden");
}


/* SEARCH */

let searchTimer;

async function searchUsers(){

  clearTimeout(searchTimer);

  searchTimer = setTimeout(async () => {

    const q =
      document.getElementById(
        "searchInput"
      ).value.trim();

    if(!q){
      document.getElementById(
        "usersList"
      ).innerHTML = "";
      return;
    }

    try{

      const users =
        await api(
          "/api/users?q=" +
          encodeURIComponent(q)
        );

      const box =
        document.getElementById(
          "usersList"
        );

      box.innerHTML = "";

      users.forEach(user => {

        const div =
          document.createElement("div");

        div.className = "user";

        div.innerHTML = `
          <div class="avatar">
            ${user.name.charAt(0).toUpperCase()}
          </div>

          <div style="flex:1">
            <b>${escapeHtml(user.name)}</b>
            <br>
            <small>@${escapeHtml(user.username)}</small>
          </div>

          <button class="primary"
            onclick='openChat(${JSON.stringify(user)})'>
            💬
          </button>

          <button class="light"
            onclick='startCall(${JSON.stringify(user)},"voice")'>
            📞
          </button>

          <button class="light"
            onclick='startCall(${JSON.stringify(user)},"video")'>
            🎥
          </button>
        `;

        box.appendChild(div);

      });

    }catch(e){
      console.log(e);
    }

  },300);
}


/* PRIVATE CHAT */

async function openChat(user){

  currentChatUser = user;

  document.getElementById("chatTitle")
    .textContent =
    "💬 " + user.name;

  showPage("chatPage");

  try{

    const messages =
      await api(
        "/api/messages/" + user.id
      );

    const box =
      document.getElementById(
        "chatBox"
      );

    box.innerHTML = "";

    messages.forEach(addChatMessage);

    box.scrollTop = box.scrollHeight;

  }catch(e){
    alert(e.message);
  }
}

function addChatMessage(msg){

  const box =
    document.getElementById(
      "chatBox"
    );

  const div =
    document.createElement("div");

  div.className =
    "msg " +
    (
      Number(msg.sender_id) === Number(me.id)
      ? "mine"
      : ""
    );

  div.textContent = msg.message;

  box.appendChild(div);

  box.scrollTop = box.scrollHeight;
}

function sendMessage(){

  if(!currentChatUser) return;

  const input =
    document.getElementById(
      "chatInput"
    );

  const message =
    input.value.trim();

  if(!message) return;

  socket.emit(
    "private-message",
    {
      receiverId: currentChatUser.id,
      message,
      senderName: me.name
    }
  );

  input.value = "";
}


/* CALL */

async function startCall(user,type){

  currentCallUser = user;
  currentCallType = type;

  showPage("callPage");

  document.getElementById("callTitle")
    .textContent =
    type === "video"
      ? "🎥 Video Call - " + user.name
      : "📞 Voice Call - " + user.name;

  await prepareMedia(type);

  createPeer();

  const offer =
    await peer.createOffer();

  await peer.setLocalDescription(
    offer
  );

  socket.emit(
    "call-user",
    {
      userId:user.id,
      fromName:me.name,
      callType:type,
      offer
    }
  );
}


async function prepareMedia(type){

  try{

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true,
          video:type === "video"
        });

    document.getElementById(
      "localVideo"
    ).srcObject = localStream;

  }catch(e){

    alert(
      "Microphone/Camera hayyama:\n" +
      e.message
    );

  }
}


function createPeer(){

  peer =
    new RTCPeerConnection(
      rtcConfig
    );

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        peer.addTrack(
          track,
          localStream
        );

      });

  }

  peer.ontrack = event => {

    document.getElementById(
      "remoteVideo"
    ).srcObject =
      event.streams[0];

  };

  peer.onicecandidate = event => {

    if(event.candidate &&
       currentCallUser){

      socket.emit(
        "ice-candidate",
        {
          toUserId:
            currentCallUser.id,

          candidate:
            event.candidate
        }
      );

    }

  };

  peer.onconnectionstatechange = () => {

    if(
      peer.connectionState ===
      "failed"
    ){
      endCallLocal();
    }

  };
}


async function receiveCall(data){

  currentCallUser = {
    id:data.fromUserId,
    name:data.fromName
  };

  currentCallType =
    data.callType;

  showPage("callPage");

  document.getElementById("callTitle")
    .textContent =
      data.callType === "video"
      ? "🎥 Video Call - " + data.fromName
      : "📞 Voice Call - " + data.fromName;

  await prepareMedia(
    data.callType
  );

  createPeer();

  await peer.setRemoteDescription(
    new RTCSessionDescription(
      data.offer
    )
  );

  const answer =
    await peer.createAnswer();

  await peer.setLocalDescription(
    answer
  );

  socket.emit(
    "answer-call",
    {
      toUserId:data.fromUserId,
      answer
    }
  );
}


function toggleCallMic(){

  if(!localStream) return;

  const track =
    localStream.getAudioTracks()[0];

  if(track){
    track.enabled =
      !track.enabled;
  }
}


function toggleCamera(){

  if(!localStream) return;

  const track =
    localStream.getVideoTracks()[0];

  if(track){
    track.enabled =
      !track.enabled;
  }
}


function endCall(){

  if(
    currentCallUser &&
    socket
  ){

    socket.emit(
      "end-call",
      {
        toUserId:
          currentCallUser.id
      }
    );

  }

  endCallLocal();
}


function endCallLocal(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

    localStream = null;
  }

  if(peer){

    peer.close();
    peer = null;
  }

  document.getElementById(
    "localVideo"
  ).srcObject = null;

  document.getElementById(
    "remoteVideo"
  ).srcObject = null;

  currentCallUser = null;

  showPage("homePage");
}


/* CLUB */

async function createClub(){

  try{

    const name =
      document.getElementById(
        "clubName"
      ).value.trim() ||
      "Mullisa Club";

    const data =
      await api(
        "/api/clubs",
        {
          method:"POST",
          body:JSON.stringify({name})
        }
      );

    document.getElementById(
      "clubCode"
    ).value =
      data.club.club_code;

    await openClub(
      data.club
    );

  }catch(e){

    alert("❌ " + e.message);
  }
}


async function joinClub(){

  try{

    const code =
      document.getElementById(
        "clubCode"
      ).value.trim();

    const data =
      await api(
        "/api/clubs/join",
        {
          method:"POST",
          body:JSON.stringify({code})
        }
      );

    await openClub(
      data.club
    );

  }catch(e){

    alert("❌ " + e.message);
  }
}


async function openClub(club){

  currentClub = club;

  document.getElementById(
    "clubTitle"
  ).textContent =
    club.name +
    " (" +
    club.club_code +
    ")";

  socket.emit(
    "join-club-room",
    club.club_code
  );

  showPage("clubPage");

  await loadClubMembers();
  await loadClubMessages();
}


async function loadClubMembers(){

  const members =
    await api(
      "/api/clubs/" +
      currentClub.club_code +
      "/members"
    );

  const box =
    document.getElementById(
      "clubMembers"
    );

  box.innerHTML = "";

  members.forEach(member => {

    const div =
      document.createElement("div");

    div.className = "user";

    div.innerHTML = `
      <div class="avatar">
        ${member.name.charAt(0).toUpperCase()}
      </div>

      <div style="flex:1">
        <b>${escapeHtml(member.name)}</b>
        <br>
        <small>
          ${
            member.role === "host"
            ? "👑 Host"
            : member.mic_on
              ? "🎤 Speaker"
              : "👂 Listener"
          }
        </small>
      </div>
    `;

    box.appendChild(div);

  });
}


async function loadClubMessages(){

  const messages =
    await api(
      "/api/clubs/" +
      currentClub.club_code +
      "/messages"
    );

  const box =
    document.getElementById(
      "clubChatBox"
    );

  box.innerHTML = "";

  messages.forEach(addClubMessage);

  box.scrollTop =
    box.scrollHeight;
}


function addClubMessage(msg){

  const box =
    document.getElementById(
      "clubChatBox"
    );

  const div =
    document.createElement("div");

  div.className =
    "msg " +
    (
      Number(msg.userId) === Number(me.id)
      ? "mine"
      : ""
    );

  div.innerHTML =
    `<b>${escapeHtml(msg.name)}</b><br>` +
    escapeHtml(msg.message);

  box.appendChild(div);

  box.scrollTop =
    box.scrollHeight;
}


function sendClubMessage(){

  if(!currentClub) return;

  const input =
    document.getElementById(
      "clubChatInput"
    );

  const message =
    input.value.trim();

  if(!message) return;

  socket.emit(
    "club-message",
    {
      code:
        currentClub.club_code,
      message
    }
  );

  input.value = "";
}


function toggleMic(){

  if(!localStream){

    alert(
      "Jalqaba Call ykn Voice media banu."
    );

    return;
  }

  const track =
    localStream.getAudioTracks()[0];

  if(track){
    track.enabled =
      !track.enabled;
  }
}


function raiseHand(){

  if(!currentClub) return;

  socket.emit(
    "club-action",
    {
      code:
        currentClub.club_code,
      action:"raise-hand"
    }
  );

  alert("🙋 Raise hand ergame.");
}


function shareClub(){

  if(!currentClub) return;

  const url =
    location.origin +
    "/?club=" +
    currentClub.club_code;

  if(navigator.share){

    navigator.share({
      title:"Mullisa-JM Club",
      text:
        "Mullisa-JM Club seeni",
      url
    });

  }else{

    navigator.clipboard.writeText(url);

    alert(
      "🔗 Link Club copy ta'eera."
    );
  }
}


function leaveClub(){

  currentClub = null;

  showPage("homePage");
}


/* LOGOUT */

function logout(){

  localStorage.removeItem(
    "mullisa_token"
  );

  token = null;

  location.reload();
}


/* SAFE HTML */

function escapeHtml(text){

  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* AUTO LOGIN */

if(token){
  startApp();
}
</script>
